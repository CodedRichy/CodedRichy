<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Source for assets/og.png. Render at 1200x630 and screenshot.
     Colours are the light tokens in css/tokens.css: bone, ink, smoke, amber ink. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Satoshi';
    src: url('fonts/Satoshi-Variable.woff2') format('woff2');
    font-weight: 300 900;
    font-display: block;
  }
  :root {
    --bone: #f7ede0;
    --ink: #2a1a0e;
    --smoke: #5a544d;
    --amber: #965719;
    --rule: rgba(42, 26, 14, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: var(--bone);
    font-family: 'Satoshi', sans-serif;
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }
  .frame {
    position: absolute;
    inset: 0;
    padding: 68px 84px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--smoke);
  }
  .name {
    font-size: 84px;
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 1.04;
  }
  .tag {
    font-size: 58px;
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.12;
    margin-top: 14px;
  }
  .tag em {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--amber);
    letter-spacing: -0.01em;
  }
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--rule);
    padding-top: 28px;
  }
  .icons { display: flex; gap: 26px; align-items: center; }
  .icons svg {
    width: 40px;
    height: 40px;
    stroke: var(--amber);
    stroke-width: 1.7;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .foot {
    white-space: nowrap;
    font-size: 22px;
    color: var(--smoke);
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">rishipraseeth.in</div>
    <div>
      <div class="name">Rishi Praseeth Krishnan</div>
      <div class="tag">AI systems that <em>remember</em>, audit themselves, and <em>ship</em>.</div>
    </div>
    <div class="bottom">
      <!-- the hero's six symbols, in card order -->
      <div class="icons">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/><path d="M12 0.5v3M12 20.5v3M0.5 12h3M20.5 12h3"/></svg>
        <svg viewBox="0 0 24 24"><path d="M2.5 21.5h19"/><path d="M4.5 21.5V12h3.5v9.5"/><path d="M10.25 21.5V5h3.5v16.5"/><path d="M16 21.5V15h3.5v6.5"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M10.2 10.2 6.5 6.5M13.8 10.2 17.5 6.5M10.2 13.8 6.5 17.5M13.8 13.8 17.5 17.5"/></svg>
        <svg viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
        <svg viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 7.5v5"/><circle cx="12" cy="16" r="0.6"/></svg>
        <svg viewBox="0 0 24 24"><path d="M3.34 19a10 10 0 1 1 17.32 0"/><path d="m12 14 4-4"/><circle cx="12" cy="14" r="1.2"/></svg>
      </div>
      <div class="foot">Founder, Thylacine</div>
    </div>
  </div>
</body>
</html>
