<svg width="840" height="340" viewBox="0 0 840 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .cursor { animation: blink 1.1s step-end infinite; }
    .dot-pulse { animation: pulse 2s ease-in-out infinite; }
    .dot-pulse-d1 { animation: pulse 2s ease-in-out 0.3s infinite; }
    .dot-pulse-d2 { animation: pulse 2s ease-in-out 0.6s infinite; }
    text { font-family: 'Consolas', 'Courier New', 'Liberation Mono', 'Menlo', monospace; }
  </style>

  <!-- Window background -->
  <rect width="840" height="340" rx="10" fill="#1A1B26"/>

  <!-- Title bar -->
  <rect width="840" height="44" rx="10" fill="#13141D"/>
  <rect y="34" width="840" height="10" fill="#13141D"/>
  <line x1="0" y1="44" x2="840" y2="44" stroke="#2A2B3A"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="22" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="22" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="22" r="6" fill="#28C840"/>

  <!-- Window title -->
  <text x="420" y="27" text-anchor="middle" font-size="12" fill="#6B6D7B">claude-code &#8212; ~/CodedRichy</text>

  <!-- Prompt line -->
  <text x="28" y="78" font-size="14">
    <tspan fill="#DA7756" font-weight="bold">&#10095; </tspan>
    <tspan fill="#FFFFFF">tell me about this developer</tspan>
    <tspan fill="#DA7756" class="cursor">&#9608;</tspan>
  </text>

  <!-- Tool block border -->
  <rect x="28" y="96" width="784" height="80" rx="6" stroke="#2E3044" fill="none"/>
  <!-- Tool block header -->
  <rect x="29" y="97" width="782" height="26" rx="5" fill="#1E1F2E"/>
  <line x1="29" y1="123" x2="811" y2="123" stroke="#2E3044"/>

  <!-- Tool header text -->
  <text x="44" y="115" font-size="11.5">
    <tspan fill="#DA7756">&#9654; </tspan>
    <tspan fill="#B0B2C3" font-weight="bold">Read</tspan>
    <tspan fill="#8B8DA0"> profile &amp; repositories</tspan>
  </text>

  <!-- Status lines -->
  <circle cx="44" cy="141" r="3" fill="#DA7756" class="dot-pulse"/>
  <text x="56" y="145" font-size="12">
    <tspan fill="#9B9DB0">Reading profile&#8230; </tspan>
    <tspan fill="#E1E2E7">CodedRichy</tspan>
  </text>

  <circle cx="44" cy="161" r="3" fill="#DA7756" class="dot-pulse-d1"/>
  <text x="56" y="165" font-size="12">
    <tspan fill="#9B9DB0">Scanning </tspan>
    <tspan fill="#E1E2E7">42 repositories</tspan>
  </text>

  <!-- Name -->
  <text x="28" y="218" font-size="24" font-weight="bold" fill="#FFFFFF" letter-spacing="2.5">RISHI PRASEETH KRISHNAN</text>

  <!-- Terracotta accent rule -->
  <rect x="28" y="228" width="56" height="2.5" rx="1" fill="#DA7756"/>

  <!-- Subtitle -->
  <text x="28" y="252" font-size="12" fill="#8B8DA0" letter-spacing="0.6">B.Tech Computer Science &#183; MITS</text>

  <!-- Bio -->
  <text x="28" y="282" font-size="13" fill="#CBCDD9">Building
    <tspan fill="#DA7756"> AI-native systems</tspan>, agent orchestration platforms,
  </text>
  <text x="28" y="302" font-size="13" fill="#CBCDD9">and intelligent developer tooling.</text>

  <!-- Bottom fade to suggest continuation -->
  <rect y="330" width="840" height="10" rx="0" fill="#1A1B26"/>
</svg>
